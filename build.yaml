---
####################################################
#          ModuleBuilder Configuration             #
####################################################

BuiltModuleSubdirectory: module
CopyPaths:
  - en-US
  - WindowsAccessControl.Format.ps1xml
#  - DSCResources
  # - Modules
Encoding: UTF8
# Can be used to manually specify module's semantic version if the preferred method of
# using GitVersion is not available, and it is not possible to set the session environment
# variable `$env:ModuleVersion`, nor setting the variable `$ModuleVersion`, in the
# PowerShell session (parent scope) before running the task `build`.
#SemVer: '99.0.0-preview1'

# Suffix to add to Root module PSM1 after merge (here, the Set-Alias exporting IB tasks)
# suffix: suffix.ps1
# prefix: prefix.ps1
prefix: Prefix.ps1
VersionedOutputDirectory: true

####################################################
#      ModuleBuilder Submodules Configuration      #
####################################################

NestedModule:
#  HelperSubmodule: # This is the first submodule to build into the output
#    Path: ./*/Modules/HelperSubmodule/HelperSubmodule.psd1
#    #  is trimmed (remove metadata & Prerelease tag) and OutputDirectory expanded (the only one)
#    OutputDirectory: ///Modules/HelperSubmodule
#    VersionedOutputDirectory: false
#    AddToManifest: false
#    SemVer:
#    # suffix:
#    # prefix:

####################################################
#       Sampler Pipeline Configuration             #
####################################################
# Defining 'Workflows' (suite of InvokeBuild tasks) to be run using their alias
BuildWorkflow:
  '.': # "." is the default Invoke-Build workflow. It is called when no -Tasks is specified to the build.ps1
    - build
    - test

  build:
    - Clean
    - Build_Module_ModuleBuilder
    - Build_NestedModules_ModuleBuilder
    - Create_changelog_release_output

  # Wiki content for https://github.com/raandree/WindowsAccessControl/wiki. It is
  # generated from the built module rather than hand-written, so it describes the
  # version that is published: one page per public command and one per DSC
  # resource, plus the hand-authored pages in 'source/WikiSource'.
  #
  # This is the DscResource.DocGenerator metatask Generate_Wiki_Content in its
  # canonical order, with Generate_Conceptual_Help ahead of it and the three
  # Sampler wiki tasks after it. Generate_Conceptual_Help writes the
  # about_<ResourceName>.help.txt files into the built module, so it has to run
  # after 'build' and before 'package_module_nupkg' for them to reach the package.
  docs:
    - Generate_Conceptual_Help
    - Create_Wiki_Output_Folder
    - Generate_Markdown_For_Public_Commands
    - Generate_External_Help_File_For_Public_Commands
    - Prepare_Markdown_FileNames_For_GitHub_Publish
    - Clean_Markdown_Of_Public_Commands
    - Generate_Markdown_For_DSC_Resources
    - Copy_Source_Wiki_Folder
    - Clean_WikiContent_For_GitHub_Publish
    - Generate_Wiki_Sidebar
    - Clean_Markdown_Metadata
    - Package_Wiki_Content

  pack:
    - build
    - docs
    - package_module_nupkg



  # Defining test task to be run when invoking `./build.ps1 -Tasks test`
  test:
    # Uncomment to modify the PSModulePath in the test pipeline (also requires the build configuration section SetPSModulePath).
    #- Set_PSModulePath
    - Pester_Tests_Stop_On_Fail
    # Use this task if pipeline uses code coverage and the module is using the
    # pattern of Public, Private, Enum, Classes.
    #- Convert_Pester_Coverage
    # The threshold is asserted over the commands this profile can execute. The
    # domain-lab acceptance measures the Active Directory and SMB share families
    # and is merged in when it is available. See ADR 0025 and ADR 0027.
    - Import_DomainLab_Code_Coverage
    - Merge_CodeCoverage_Files
    - Assert_Merged_Code_Coverage_Threshold

  publish:
    - Publish_Release_To_GitHub
    - Publish_Module_To_Gallery
    - Publish_GitHub_Wiki_Content

####################################################
#       PESTER  Configuration                      #
####################################################

Pester:
  Configuration:
    Run:
      Path:
        - tests/QA
        - tests/Unit
        - tests/Integration
    Output:
      Verbosity: Detailed
      StackTraceVerbosity: Full
      CIFormat: Auto
    Filter:
      Tag:
      ExcludeTag:
    CodeCoverage:
      CoveragePercentTarget: 80
      OutputPath: JaCoCo_coverage.xml
      OutputEncoding: ascii
      UseBreakpoints: true
    TestResult:
      OutputFormat: NUnitXML
      OutputEncoding: ascii
  ExcludeFromCodeCoverage:

# Merge the locally measured code coverage with the domain-lab acceptance coverage.
# CodeCoverageFilePattern      - the pattern used to search all code coverage files
#                                that are merged into one document.
# CodeCoverageMergedOutputFile - the file that is created by the merge build task and
#                                that the threshold is asserted over.
# DomainLabCodeCoverageFile    - the JaCoCo document that the domain-lab acceptance
#                                runner carries back from the lab. It is outside
#                                'output' because the build deletes that tree.
# DomainLabOnlySourcePath      - the Active Directory and SMB share source files that no
#                                test profile executes a single command of. Their live
#                                evidence is a tests/Lab suite that needs a domain
#                                controller and a delegated member server. Their commands
#                                are reported but not asserted. Every other source file,
#                                and every line that cannot be attributed to one, stays
#                                inside the asserted scope, and a declared file the local
#                                run does execute fails the build.
CodeCoverage:
  CodeCoverageFilePattern: JaCoCo_coverage*.xml
  CodeCoverageMergedOutputFile: JaCoCo_merged.xml
  DomainLabCodeCoverageFile: tests/Lab/coverage/JaCoCo_coverage_DomainLab.xml
  DomainLabOnlySourcePath:
    - Private/Get-WindowsADObjectRecord.ps1
    - Private/Get-WindowsADRootDse.ps1
    - Private/Get-WindowsADRuleEnrichment.ps1
    - Private/New-WindowsADConnection.ps1
    - Private/Resolve-WindowsADObjectTarget.ps1
    - Public/Get-ADObjectSecurityDescriptor.ps1
    - Public/Set-ADObjectSecurityDescriptor.ps1
    - Private/Invoke-WindowsSmbShareAclRuleMutation.ps1
    - Private/Invoke-WindowsSmbShareCommandBatch.ps1
    - Private/Set-WindowsSmbShareSecurityDescriptor.ps1
    - Public/Add-SmbShareAccessRule.ps1
    - Public/Get-SmbShareAccessRule.ps1
    - Public/Get-SmbShareSecurityDescriptor.ps1
    - Public/Remove-SmbShareAccessRule.ps1
    - Public/Set-SmbShareSecurityDescriptor.ps1


# Import ModuleBuilder tasks from a specific PowerShell module using the build
# task's alias. Wildcard * can be used to specify all tasks that has a similar
# prefix and or suffix. The module contain the task must be added as a required
# module in the file RequiredModules.psd1.
ModuleBuildTasks:
  Sampler:
    - '*.build.Sampler.ib.tasks'
  Sampler.GitHubTasks:
    - '*.ib.tasks'
  DscResource.DocGenerator:
    - 'Task.*'



# Invoke-Build Header to be used to 'decorate' the terminal output of the tasks.
TaskHeader: |
  param($Path)
  ""
  "=" * 79
  Write-Build Cyan "`t`t`t$($Task.Name.replace("_"," ").ToUpper())"
  Write-Build DarkGray  "$(Get-BuildSynopsis $Task)"
  "-" * 79
  Write-Build DarkGray "  $Path"
  Write-Build DarkGray "  $($Task.InvocationInfo.ScriptName):$($Task.InvocationInfo.ScriptLineNumber)"
  ""

####################################################
#                 GitHub Release                   #
####################################################

# Read by Publish_Release_To_GitHub and Create_ChangeLog_GitHub_PR.
# UpdateChangelogOnPrerelease is false so only a stable release moves the
# Unreleased section of CHANGELOG.md into a released section.
# ReleaseAssets attaches the packaged wiki to the GitHub release, so the
# documentation of a given version stays retrievable after the wiki has moved on.
GitHubConfig:
  GitHubFilesToAdd:
    - CHANGELOG.md
  ReleaseAssets:
    - output/WikiContent.zip
  GitHubConfigUserName: raandree
  GitHubConfigUserEmail: raandree@users.noreply.github.com
  UpdateChangelogOnPrerelease: false

####################################################
#         DscResource.DocGenerator Configuration   #
####################################################

DscResource.DocGenerator:
  Generate_Markdown_For_DSC_Resources:
    # Without this the twenty resource pages carry no category and the sidebar
    # generator files them all under its 'General' default, next to Home.
    ClassResourceMetadata:
      Type: ClassResource
      Category: DSC resources
  Generate_Wiki_Sidebar:
    Debug: false
    AlwaysOverwrite: true
  Publish_GitHub_Wiki_Content:
    Debug: false
