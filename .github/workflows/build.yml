---
name: Build

on:
  push:
    branches:
      - main
    tags:
      # A stable release is published from its own tag. Pre-release tags are
      # excluded because Publish_Release_To_GitHub creates them itself on a main
      # build, and re-running the same version would be rejected by the Gallery.
      - 'v*'
      - '!v*-*'
    paths-ignore:
      # The changelog pull request that the publish job raises must not start
      # another release build.
      - CHANGELOG.md
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  defaultBranch: main

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  # A release run is never cancelled. Cancelling between the GitHub release and
  # the Gallery publish would leave the two out of step.
  cancel-in-progress: >-
    ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build module
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      module-version: ${{ steps.calculate-version.outputs.module-version }}
    steps:
      - name: Check out full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Calculate module version
        id: calculate-version
        shell: pwsh
        run: |
          dotnet tool install --global GitVersion.Tool --version 5.12.0
          $moduleVersion = dotnet-gitversion /showvariable NuGetVersionV2
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($moduleVersion)) {
              throw 'GitVersion did not return a module version.'
          }

          $moduleVersion = $moduleVersion.Trim()
          "module-version=$moduleVersion" |
              Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Resolve dependencies and package module
        shell: pwsh
        env:
          ModuleVersion: ${{ steps.calculate-version.outputs.module-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./build.ps1 -ResolveDependency -Tasks pack

      - name: Upload Sampler output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sampler-output
          path: output/
          if-no-files-found: error
          retention-days: 7

  test:
    name: Test with ${{ matrix.name }}
    needs: build
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PowerShell 7
            edition: pwsh
            artifact-suffix: pwsh
          - name: Windows PowerShell 5.1
            edition: powershell-5.1
            artifact-suffix: powershell-5.1
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download Sampler output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sampler-output
          path: output

      - name: Run Sampler tests with PowerShell 7
        if: matrix.edition == 'pwsh'
        shell: pwsh
        env:
          ModuleVersion: ${{ needs.build.outputs.module-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./build.ps1 -Tasks test

      - name: Remove PowerShell 7 module directories from the machine module search path
        if: matrix.edition == 'powershell-5.1'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          # PowerShell 7 ships Core-only copies of the in-box Microsoft.PowerShell.* modules.
          # When its $PSHOME\Modules is on the machine search path, Windows PowerShell resolves
          # those first and cannot load them, so every host that has to autoload one fails:
          # build.ps1 loses Import-PowerShellDataFile and the DSC engine loses Get-Acl.
          $coreModuleDirectory = '\\PowerShell\\\d+\\Modules\\?$'
          $machinePath = [System.Environment]::GetEnvironmentVariable('PSModulePath', 'Machine')
          $entries = $machinePath -split ';'

          if (-not @($entries | Where-Object { $_ -match $coreModuleDirectory })) {
              Write-Host 'The machine module search path carries no PowerShell 7 module directory.'
              exit 0
          }

          $repairedPath = ($entries | Where-Object { $_ -notmatch $coreModuleDirectory }) -join ';'
          [System.Environment]::SetEnvironmentVariable('PSModulePath', $repairedPath, 'Machine')
          "PSModulePath=$repairedPath" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Invoke-DscResource runs in WmiPrvSE, which takes its environment from the WMI
          # service, so that service has to restart before the DSC tests see the repair.
          Restart-Service -Name 'Winmgmt' -Force

          Write-Host "Repaired machine PSModulePath: $repairedPath"

      - name: Run Sampler tests with Windows PowerShell 5.1
        if: matrix.edition == 'powershell-5.1'
        shell: powershell
        env:
          ModuleVersion: ${{ needs.build.outputs.module-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./build.ps1 -Tasks test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.artifact-suffix }}
          path: |
            output/testResults/NUnitXml_*.xml
            output/testResults/JaCoCo_coverage.xml
            output/testResults/JaCoCo_merged.xml
          if-no-files-found: warn
          retention-days: 7

  publish:
    name: Publish module ${{ needs.build.outputs.module-version }}
    needs: [build, test]
    runs-on: windows-latest
    timeout-minutes: 30
    # Publish only from the upstream repository, and only for the default branch
    # or a version tag. A fork or a pull request never reaches the Gallery.
    if: >-
      github.repository_owner == 'raandree' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out full repository history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download Sampler output
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sampler-output
          path: output

      # Both Sampler release tasks skip themselves when their token is empty, and
      # a skipped Publish_Release_To_GitHub still lets the Gallery publish run.
      # That ships a version without the v* tag GitVersion anchors the next
      # pre-release number on, so the next build recomputes the published version
      # and the Gallery rejects it with HTTP 409. Fail here instead.
      - name: Verify release secrets
        shell: pwsh
        env:
          GitHubToken: ${{ secrets.GitHubToken }}
          GalleryApiToken: ${{ secrets.GalleryApiToken }}
        run: |
          $ErrorActionPreference = 'Stop'

          $missingSecret = @('GitHubToken', 'GalleryApiToken') |
              Where-Object -FilterScript { -not [System.Environment]::GetEnvironmentVariable($_) }

          if ($missingSecret) {
              throw ("Missing repository secret: {0}. Add it under Settings > Secrets and variables > Actions." -f ($missingSecret -join ', '))
          }

      - name: Publish release to GitHub and the PowerShell Gallery
        shell: pwsh
        env:
          GitHubToken: ${{ secrets.GitHubToken }}
          GalleryApiToken: ${{ secrets.GalleryApiToken }}
          ModuleVersion: ${{ needs.build.outputs.module-version }}
          ReleaseBranch: ${{ env.defaultBranch }}
          MainGitBranch: ${{ env.defaultBranch }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./build.ps1 -Tasks publish

      - name: Send changelog pull request
        shell: pwsh
        env:
          GitHubToken: ${{ secrets.GitHubToken }}
          ModuleVersion: ${{ needs.build.outputs.module-version }}
          ReleaseBranch: ${{ env.defaultBranch }}
          MainGitBranch: ${{ env.defaultBranch }}
        run: |
          $ErrorActionPreference = 'Stop'
          ./build.ps1 -Tasks Create_ChangeLog_GitHub_PR
